<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jens van Duinkerken — De Fabriek</title>
    <meta name="description" content="Jens van Duinkerken, student HBO ICT aan Windesheim. Rijd met een heftruck door mijn portfolio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" />
    <!-- Styling van het laadscherm staat hier, zodat het al werkt voordat de bundel binnen is. -->
    <style>
      html, body { margin: 0; background: #e6e3ee; }
      .loader {
        position: fixed; inset: 0; z-index: 10;
        display: grid; place-items: center; padding: 16px;
        background: rgb(230 227 238 / 0.98);
        color: #323245; font-family: 'Instrument Sans', system-ui, sans-serif;
        transition: background 0.6s, opacity 0.6s, transform 0.6s;
      }
      .loader--ready { background: rgb(230 227 238 / 0.55); backdrop-filter: blur(6px); }
      .loader--out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .loader__card {
        width: min(440px, 100%); box-sizing: border-box; padding: 28px;
        background: #f6f3fa; border: 2px solid #323245; border-radius: 18px;
        box-shadow: 6px 6px 0 #323245;
      }
      .loader__kicker { margin: 0; font: 500 12px 'JetBrains Mono', monospace; color: #ff7e44; }
      .loader__title { margin: 2px 0 8px; font: 800 64px/1 'Bricolage Grotesque', system-ui, sans-serif; }
      .loader__intro { margin: 0 0 20px; line-height: 1.5; }
      .loader__bar { height: 14px; border: 2px solid #323245; border-radius: 999px; overflow: hidden; background: #fff; }
      /* gestreepte balk die beweegt als een lopende band */
      .loader__bar > div {
        height: 100%; transition: width 0.3s;
        background: repeating-linear-gradient(-45deg, #ff7e44 0 10px, #ffc044 10px 20px);
        background-size: 28px 28px; animation: belt 0.8s linear infinite;
      }
      @keyframes belt { to { background-position: 28px 0; } }
      .loader__status { margin: 8px 0 18px; font: 500 12px 'JetBrains Mono', monospace; color: #6b6a80; }
      .loader__keys { margin: 0 0 22px; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
      .key {
        display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; margin-right: 3px;
        box-sizing: border-box; border: 2px solid #323245; border-bottom-width: 4px; border-radius: 6px;
        font: 500 12px 'JetBrains Mono', monospace; vertical-align: middle; background: #fff;
      }
      .key--wide { padding: 0 8px; }
      .key--zone { background: rgb(103 148 217 / 0.25); border-color: #6794d9; border-bottom-width: 2px; }
      .loader__start {
        width: 100%; padding: 14px; border: 2px solid #323245; border-radius: 999px; cursor: pointer;
        font: 800 18px 'Bricolage Grotesque', system-ui, sans-serif; color: #fff; background: #323245;
        transition: background 0.2s, transform 0.1s;
      }
      .loader__start:not(:disabled):hover { background: #ff7e44; }
      .loader__start:not(:disabled):active { transform: translateY(2px); }
      .loader__start:disabled { cursor: wait; opacity: 0.5; }
      .loader__classic { display: block; margin-top: 14px; text-align: center; font-size: 13px; color: #6b6a80; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader">
        <div class="loader__card">
          <p class="loader__kicker">[ PORTFOLIO / 2026 ]</p>
          <h1 class="loader__title">jens.</h1>
          <p class="loader__intro">Welkom in mijn fabriek. Pak de heftruck en rij rond: elke hal is een stukje van mij.</p>
          <div class="loader__bar"><div style="width: 4%"></div></div>
          <p class="loader__status">Fabriek laden…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
